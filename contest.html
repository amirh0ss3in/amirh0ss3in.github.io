<div class="form-container">
  <h2>Enter the Contest</h2>
  <p>Submit your entry below. We will contact the winner via email.</p>

  <form id="contest-form">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="answer">Your Short Answer (max 500 characters)</label>
      <textarea id="answer" name="answer" rows="6" maxlength="500" required></textarea>
    </div>
    <button type="submit" id="submit-button">Submit Entry</button>
  </form>

  <div id="status-container" style="margin-top: 20px;"></div>

</div>

<style>
/* Same minimal styling as before */
.form-group{margin-bottom:1.5rem}label{display:block;margin-bottom:.5rem;font-weight:700}input,textarea{width:100%;padding:.75rem;border:1px solid #ccc;border-radius:4px;font-size:1rem;box-sizing:border-box}body.dark-theme input,body.dark-theme textarea{background-color:#333;color:#eee;border-color:#555}button{display:inline-block;padding:.75rem 1.5rem;border:none;background-color:#3498db;color:#fff;font-size:1rem;font-weight:700;border-radius:4px;cursor:pointer;transition:background-color .2s ease-in-out}button:hover{background-color:#2980b9}button:disabled{background-color:#a9a9a9;cursor:not-allowed}
#status-container div{padding:20px;border-radius:4px;word-break:break-word}
#status-container .success{background-color:#d4edda;color:#155724;border:1px solid #c3e6cb}
#status-container .error{background-color:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
</style>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // PASTE YOUR NEW WEB APP URL FROM STEP 2 HERE
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxeo3geXpsu9yPUqI2K5UTkHrjwj5gel7BtcXzLFUcBghXVk8tsQtsNEoLTWIlQ8MV1/exec'; 

    const form = document.getElementById('contest-form');
    const submitButton = document.getElementById('submit-button');
    const statusContainer = document.getElementById('status-container');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      submitButton.disabled = true;
      submitButton.textContent = 'Submitting...';
      statusContainer.innerHTML = '';

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: new FormData(form),
        mode: 'cors', // Explicitly set mode for clarity
      })
      .then(response => {
        // This block checks for network-level issues before parsing JSON
        if (response.redirected) {
          throw new Error('Redirect Error: The request was redirected. Please check that the Apps Script deployment permission for "Who has access" is set to "Anyone".');
        }
        if (!response.ok) {
          throw new Error(`Network Error: The server responded with status ${response.status} (${response.statusText}).`);
        }
        return response.json(); // Attempt to parse the body as JSON
      })
      .then(data => {
        // This block handles the JSON response from your script
        if (data.result === 'success') {
          form.style.display = 'none';
          statusContainer.innerHTML = `<div class="success"><h3>Success!</h3><p>Your entry has been received. Thank you!</p></div>`;
        } else {
          // 'data.error' comes directly from your Apps Script 'catch' block
          throw new Error(`Server-Side Error: ${data.error || 'An unknown error occurred.'}`);
        }
      })
      .catch(error => {
        // This block catches any error from the fetch chain
        console.error('Submission failed:', error);
        statusContainer.innerHTML = `<div class="error"><h3>Submission Failed</h3><p>${error.message}</p></div>`;
        submitButton.disabled = false;
        submitButton.textContent = 'Submit Entry';
      });
    });
  });
</script>
