---
layout: page
title: Contest Entry
description: "Enter our contest for a chance to win!"
---

<style>
  /* Custom styles for the form to match the Indigo theme */
  .contest-form-container {
    max-width: 600px;
    margin: 2rem auto;
    padding: 2rem;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    background-color: #fdfdfd;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: bold;
    color: #555;
  }

  .form-group input[type="text"],
  .form-group input[type="email"],
  .form-group textarea {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 1rem;
    color: #333;
    box-sizing: border-box; /* Important for padding and width */
  }
  
  .form-group input:focus,
  .form-group textarea:focus {
      border-color: #3f51b5; /* Indigo theme accent color */
      outline: none;
  }

  .form-group textarea {
    min-height: 120px;
    resize: vertical;
  }
  
  .submit-btn {
    display: inline-block;
    background-color: #3f51b5; /* Indigo theme accent color */
    color: white;
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s ease-in-out;
    width: 100%;
  }

  .submit-btn:hover {
    background-color: #303f9f;
  }
  
  .submit-btn:disabled {
    background-color: #9fa8da;
    cursor: not-allowed;
  }

  .form-message {
    padding: 1rem;
    margin-top: 1rem;
    border-radius: 4px;
    text-align: center;
    display: none; /* Hidden by default */
  }

  .form-message.success {
    background-color: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #a5d6a7;
  }

  .form-message.error {
    background-color: #ffebee;
    color: #c62828;
    border: 1px solid #ef9a9a;
  }
</style>

<div class="contest-form-container">
  <h2>Submit Your Entry</h2>
  <p>Fill out the form below to enter the contest. Good luck!</p>

  <form id="contest-form">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="answer">Short Answer</label>
      <textarea id="answer" name="answer" placeholder="Why should you win?" required></textarea>
    </div>
    <button type="submit" class="submit-btn" id="submit-button">Submit Entry</button>
  </form>
  
  <div id="form-message" class="form-message"></div>
</div>


<script>
  // This is the URL you copied from the Google Apps Script deployment
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyeg7mwUv5jkWdQBW_wKcRT_HK4FIIacllc3Ks6Ip5wUu7_T4nE-SZXF7WjtFgXy2oL/exec'; 

  const form = document.getElementById('contest-form');
  const submitButton = document.getElementById('submit-button');
  const messageDiv = document.getElementById('form-message');

  form.addEventListener('submit', function(e) {
    e.preventDefault(); // Prevent the default form submission

    submitButton.disabled = true;
    submitButton.textContent = 'Submitting...';
    messageDiv.style.display = 'none'; // Hide previous messages

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: new FormData(form)
    })
    .then(response => response.json())
    .then(data => {
      if (data.result === 'success') {
        messageDiv.textContent = 'Thank you! Your entry has been submitted successfully.';
        messageDiv.className = 'form-message success';
        form.reset(); // Clear the form
      } else {
        // The error object might contain more details, but we'll show a generic message.
        throw new Error(data.error || 'An unknown error occurred.');
      }
    })
    .catch(error => {
      console.error('Error!', error.message);
      messageDiv.textContent = 'Oops! Something went wrong. Please try again later.';
      messageDiv.className = 'form-message error';
    })
    .finally(() => {
      // Re-enable the button and show the message
      submitButton.disabled = false;
      submitButton.textContent = 'Submit Entry';
      messageDiv.style.display = 'block';
    });
  });
</script>
