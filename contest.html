<div class="post-content">

  <h1>Contest Entry Form</h1>
  <p>Fill out the form below to enter our contest. Good luck!</p>

  <!-- The Form -->
  <form id="contest-form" name="contest-form">
    
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>
    
    <div class="form-group">
      <label for="answer">Short Answer (max 500 characters)</label>
      <textarea id="answer" name="answer" rows="6" maxlength="500" required></textarea>
    </div>

    <button type="submit" id="submit-button">Submit Entry</button>
  
  </form>

  <!-- Status Message Div -->
  <div id="status-message"></div>

</div>

<!-- Basic styling to ensure form elements are well-spaced. -->
<!-- This will likely be complemented by your theme's main CSS. -->
<style>
  .form-group {
    margin-bottom: 1.5rem;
  }
  label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: bold;
  }
  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box; /* Important for responsive layouts */
  }
  button {
    cursor: pointer;
    padding: 12px 25px;
    border: none;
    border-radius: 4px;
    /* These colors are common placeholders; the Indigo theme will likely override them. */
    background-color: #337ab7; 
    color: white;
    font-size: 1rem;
    font-weight: bold;
  }
  button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
  }
  #status-message {
    margin-top: 1rem;
    padding: 10px;
    border-radius: 4px;
    display: none; /* Hidden by default */
  }
  #status-message.success {
    display: block;
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }
  #status-message.error {
    display: block;
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }
</style>

<script>
  // Wait for the DOM to be fully loaded before running the script
  document.addEventListener("DOMContentLoaded", function() {
    
    // --- Step 1: SET YOUR WEB APP URL ---
    // This is the URL you get after deploying the Google Apps Script
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzDEuwc6W9umS-qE1pB9Ow-5yt24HPHDL2xM6LG7J_XYPkV-kneVtuad1eZ3uYu0KiD/exec'; 

    // Get the form and status message elements from the DOM
    const form = document.getElementById('contest-form');
    const statusMessage = document.getElementById('status-message');
    const submitButton = document.getElementById('submit-button');
    
    // --- Step 2: Add event listener for form submission ---
    form.addEventListener('submit', function(e) {
      
      // Prevent the default form submission behavior
      e.preventDefault(); 
      
      // --- Client-side validation check ---
      if (!form.checkValidity()) {
        console.warn('Form validation failed.');
        statusMessage.textContent = 'Please fill out all required fields correctly.';
        statusMessage.className = 'error';
        return; // Stop the function if form is invalid
      }

      // Disable the submit button to prevent multiple submissions
      submitButton.disabled = true;
      submitButton.textContent = 'Submitting...';
      
      // Show a "processing" message
      statusMessage.textContent = 'Sending your entry... please wait.';
      statusMessage.className = 'success';

      // Use the Fetch API to send data
      // FormData will automatically collect all form field data
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: new FormData(form),
      })
      .then(response => {
        // Check if the response was successful
        if (!response.ok) {
           // If the server response is not ok, throw an error to be caught by the .catch block
           return response.json().then(errorInfo => Promise.reject(errorInfo));
        }
        return response.json();
      })
      .then(data => {
        // --- Handle SUCCESS response from Google Apps Script ---
        console.log('Success:', data);
        if (data.result === 'success') {
          statusMessage.textContent = 'Success! Your entry has been recorded.';
          statusMessage.className = 'success';
          form.reset(); // Clear the form fields
        } else {
          // Handle cases where the script runs but reports an application-level error
          throw new Error(data.message || 'An unknown error occurred on the server.');
        }
      })
      .catch(error => {
        // --- Handle ERROR response from Google Apps Script or network failure ---
        console.error('Error submitting form:', error);
        statusMessage.textContent = `An error occurred: ${error.message || 'Please try again later.'}`;
        statusMessage.className = 'error';
        // --- Debugging tip ---
        console.log("DEBUG: Make sure the SCRIPT_URL is correct and the Apps Script is deployed for 'Anyone'.");
      })
      .finally(() => {
        // --- Re-enable the submit button regardless of success or error ---
        submitButton.disabled = false;
        submitButton.textContent = 'Submit Entry';
      });
    });
  });
</script>
