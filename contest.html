permalink: /contest/

<div class="form-container">
  <h2>Enter the Contest</h2>
  <p>Submit your entry below. We will contact the winner via email.</p>

  <!--
    IMPORTANT: The <form> tag below has NO 'action' attribute. 
    This is critical for the JavaScript to work correctly.
  -->
  <form id="contest-form">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="answer">Your Short Answer (max 500 characters)</label>
      <textarea id="answer" name="answer" rows="6" maxlength="500" required></textarea>
    </div>

    <button type="submit" id="submit-button">Submit Entry</button>
  </form>

  <!-- Success Message -->
  <div id="success-message" style="display:none; padding: 20px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 4px; margin-top: 20px;">
    <h3>Thank You!</h3>
    <p>Your entry has been received successfully.</p>
  </div>

  <!-- Error Message -->
  <div id="error-message" style="display:none; padding: 20px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 4px; margin-top: 20px;">
    <h3>Oops! An Error Occurred.</h3>
    <p id="error-text">Something went wrong. Please try again.</p>
  </div>
</div>

<!-- Basic styling to match the minimal theme -->
<style>
  .form-group { margin-bottom: 1.5rem; }
  label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
  input[type="text"], input[type="email"], textarea {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    background-color: #f9f9f9;
    color: #333;
    font-size: 1rem;
    box-sizing: border-box;
  }
  /* Style for dark themes like Indigo */
  body.dark-theme input, body.dark-theme textarea {
    background-color: #333;
    color: #eee;
    border-color: #555;
  }
  button {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    border: none;
    background-color: #3498db;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.2s ease-in-out;
  }
  button:hover { background-color: #2980b9; }
  button:disabled { background-color: #a9a9a9; cursor: not-allowed; }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // --- 1. MAKE SURE THIS URL IS CORRECT ---
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyI-XMIIAAktpQLNCM4jQ_hSbFRJ5oij_H_F7xExXVcbYURYTdXnvQr355H3OmbANAO/exec'; 

    const form = document.getElementById('contest-form');
    const submitButton = document.getElementById('submit-button');
    const successMessage = document.getElementById('success-message');
    const errorMessage = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');

    // This is the most important part of the code
    form.addEventListener('submit', function(e) {
      // This line PREVENTS the default form submission (the GET request)
      e.preventDefault(); 
      
      submitButton.disabled = true;
      submitButton.textContent = 'Submitting...';
      errorMessage.style.display = 'none';

      const formData = new FormData(form);

      // This is the code that sends the data to Google as a POST request
      fetch(SCRIPT_URL, { method: 'POST', body: formData })
        .then(response => {
          if (response.redirected) {
            throw new Error('Form submission was redirected. Check that the Apps Script deployment is set to "Who has access: Anyone".');
          }
          if (!response.ok) {
            throw new Error(`Network response was not ok: ${response.statusText}`);
          }
          return response.json();
        })
        .then(data => {
          if (data.result === 'success') {
            form.style.display = 'none';
            successMessage.style.display = 'block';
          } else {
            throw new Error(data.error || 'An unknown server error occurred.');
          }
        })
        .catch(error => {
          console.error('Submission Error!', error);
          errorText.textContent = error.message;
          errorMessage.style.display = 'block';
          
          submitButton.disabled = false;
          submitButton.textContent = 'Submit Entry';
        });
    });
  });
</script>
