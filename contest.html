<div class="post-content">
    <h1>Contest Entry Form</h1>
    <p>Fill out the form below to enter our contest. Good luck!</p>

    <!-- The Form -->
    <form id="contest-form" name="contest-form">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="answer">Short Answer (max 500 characters)</label>
            <textarea id="answer" name="answer" rows="6" maxlength="500" required></textarea>
        </div>
        <button type="submit" id="submit-button">Submit Entry</button>
    </form>

    <!-- Status Message Div -->
    <div id="status-message"></div>
</div>

<!-- Minimalist styling that inherits from your Jekyll theme -->
<style>
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
    input[type="text"], input[type="email"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { cursor: pointer; padding: 12px 25px; border: none; border-radius: 4px; background-color: #337ab7; color: white; font-size: 1rem; font-weight: bold; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #status-message { margin-top: 1rem; padding: 15px; border-radius: 4px; display: none; border: 1px solid transparent; }
    #status-message.success { display: block; background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
    #status-message.error { display: block; background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // --- STEP 1: PASTE YOUR GOOGLE APPS SCRIPT URL HERE ---
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxbPoltE2Bhc6r4UV9emGftKV9dfsPZZqA9ikAENCc7WWPPVZyCBz8MAKjL2HwX33Y/exec';

    const form = document.getElementById('contest-form');
    const statusMessage = document.getElementById('status-message');
    const submitButton = document.getElementById('submit-button');

    // --- CRITICAL CHECK ---
    // This helps you catch the most common error immediately.
    if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_WEB_APP_URL_GOES_HERE') {
        console.error("ERROR: SCRIPT_URL is not set. Please paste your Google Apps Script Web App URL into the contest.html file.");
        statusMessage.textContent = 'FORM IS NOT CONFIGURED. The script URL is missing.';
        statusMessage.className = 'error';
        submitButton.disabled = true;
        return;
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault(); // Stop the default form submission

        // Disable button to prevent double-clicking
        submitButton.disabled = true;
        submitButton.textContent = 'Submitting...';
        statusMessage.textContent = 'Sending your entry, please wait...';
        statusMessage.className = 'success'; // Use a neutral color for processing

        const formData = new FormData(form);
        
        console.log("DEBUG: Submitting data to URL:", SCRIPT_URL);

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: formData,
            mode: 'no-cors' // Use 'no-cors' initially for simplicity if redirecting; switch to 'cors' if handling JSON response is a priority
        })
        .then(response => {
            console.log("DEBUG: Received a response from the server.");
            // Because we cannot see the response content with no-cors, we assume success
            // The 'real' success or error is handled by Google's redirect
            statusMessage.textContent = 'Success! Your entry was sent. Redirecting...';
            statusMessage.className = 'success';
            form.reset(); // Clear the form
            // Redirect to a simple thank-you page after 2 seconds
            setTimeout(() => {
                window.location.href = "{{ site.baseurl }}/thank-you.html"; // Make a simple thank you page!
            }, 2000);
        })
        .catch(error => {
            console.error('Fetch Error:', error);
            statusMessage.innerHTML = '<strong>Error!</strong> Could not submit form. Please check your internet connection.<br><br><strong>Troubleshooting:</strong> In the browser console (F12), look for a "CORS" error. This means the script was not deployed correctly. Review Step 3C of the setup guide.';
            statusMessage.className = 'error';
        })
        .finally(() => {
            // Re-enable the button in case of error (success case redirects away)
            submitButton.disabled = false;
            submitButton.textContent = 'Submit Entry';
        });
    });
});
</script>
