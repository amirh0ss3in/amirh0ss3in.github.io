name: Sync ATProject submodule

on:
  schedule:
    # Check for ATProject updates every 6 hours
    - cron: "0 */6 * * *"
  repository_dispatch:
    types: [atproject-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update ATProject to latest main
        run: git submodule update --init --remote atproject

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atproject
          if git diff --staged --quiet; then
            echo "ATProject submodule already up to date."
          else
            git commit -m "chore: sync ATProject submodule"
            git push
          fi
